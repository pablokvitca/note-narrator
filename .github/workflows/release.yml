name: Release

on:
    push:
        tags:
            - '*'

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: '20.x'
                  cache: 'npm'
            - run: npm ci
            - run: npm run build
            - run: npm test

            # Signs main.js and styles.css with GitHub's build-provenance attestation, so anyone
            # (including Obsidian's own release checks) can verify they were built by this
            # workflow from this repository's source, not hand-uploaded or tampered with.
            - name: Attest build provenance
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: 'main.js, styles.css'

            - name: Verify tag matches manifest.json version
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  manifest_version=$(node -p "require('./manifest.json').version")
                  if [ "$tag" != "$manifest_version" ]; then
                    echo "Tag ($tag) does not match manifest.json version ($manifest_version)"
                    exit 1
                  fi

            - name: Create GitHub release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  # A SemVer pre-release suffix (e.g. 1.7.0-beta.1) marks this as a BRAT beta
                  # release rather than a stable one, so it doesn't show up as "latest" and
                  # BRAT users must opt in to installing beta versions to pick it up.
                  prerelease_flag=()
                  if [[ "$tag" == *-* ]]; then
                    prerelease_flag=(--prerelease)
                  fi

                  gh release create "$tag" \
                    main.js manifest.json styles.css LICENSE THIRD_PARTY_NOTICES.md \
                    --title "$tag" \
                    --generate-notes \
                    "${prerelease_flag[@]}"
